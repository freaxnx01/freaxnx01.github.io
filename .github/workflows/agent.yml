name: Claude

# Consumer trigger stub for the agent-workflow pipeline.
# Labeling an issue `ai-implement` dispatches the reusable implement workflow,
# which opens a draft PR. Draft-only posture: no auto-review, no auto-merge.
#
# Filename matters: the retry-on-rate-limit path and chain-dispatch both
# redispatch `agent.yml` by default and are not consumer-overridable, so this
# must not be renamed to `claude.yml`.
#
# Setup reference: freaxnx01/agent-workflow docs/CONSUMER-SETUP.md §1.

on:
  issues:
    types: [labeled]

# A reusable workflow can never be granted more than its caller, and this repo's
# default GITHUB_TOKEN is read-only. Omitting this block fails the run at
# startup_failure with zero jobs and no logs.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Required for the `agent:opencode` path — without it opencode never
      # registers the `openrouter` provider and the run dies with a
      # ProviderModelNotFoundError (agent-workflow#164).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      issue-number: ${{ github.event.issue.number }}
      # Public repo — GitHub-hosted runners only. Never attach a self-hosted
      # runner here (fork-PR attack surface).
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
